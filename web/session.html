<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PHASE</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #040506; color: #e8ebed; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; font: 16px sans-serif; pointer-events: none; }
    #status[hidden] { display: none; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0">WebGL 2.0 is required.</canvas>
  <div id="status">PHASE</div>
  <script src="$GODOT_URL"></script>
  <script id="phase-start">
    const config = $GODOT_CONFIG;
    // エンジンの初期化前に既定の/userfs永続マウントも無効にする。
    config.persistentPaths = [];
    config.serviceWorker = '';
    const engine = new Engine(config);
    engine.startGame().then(() => {
      document.getElementById('status').hidden = true;
    }).catch(error => {
      document.getElementById('status').textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
